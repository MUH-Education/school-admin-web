<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>सुबह चढ़ाना</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D6E8B}a:hover{color:#16222E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #EEF1F4; color: #16222E; font-family: 'Mukta', 'Noto Sans Devanagari', system-ui, sans-serif; font-size: 16px; line-height: 1.35">

<header style="flex: none; box-sizing: border-box; min-height: 68px; background: #16222E; color: #FFFFFF; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
<a href="MobileToday.dc.html" aria-label="वापस" style="flex: none; width: 44px; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1px solid #8FA0AF; color: #FFFFFF; font-size: 28px; line-height: 1; text-decoration: none">‹</a>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.2">सुबह चढ़ाना</h1><span style="font-size: 14.5px; color: #C9D3DC">रूट 4 · वैन 4</span></div>
<div style="flex: none; display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 24px; font-weight: 700; line-height: 1.1">{{total}}</span><span style="font-size: 13.5px; color: #C9D3DC">बच्चे चढ़े</span></div>
</header>

<div style="flex: none; display: flex; align-items: center; gap: 10px; padding: 7px 16px; background: #FFFFFF; border-bottom: 1px solid #D3DBE2; font-size: 14.5px"><span style="flex: none; width: 10px; height: 10px; background: #2E7D5B"></span>सब जानकारी ऑफ़िस पहुँच गई</div>

<div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; box-sizing: border-box; padding: 8px 16px; background: #FFFFFF; border-bottom: 1px solid #D3DBE2; color: #5A6B7A; font-size: 16px"><span>✓ स्टॉप 1 · साधनवास</span><span>5 चढ़े · 7:26</span></div>

<div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; box-sizing: border-box; padding: 8px 16px; background: #1D6E8B; color: #FFFFFF"><span style="font-size: 21px; font-weight: 700">स्टॉप 2 · जाखल</span><span style="font-size: 14.5px; text-align: right; line-height: 1.25">{{here}}</span></div>

<main style="flex: 1; min-height: 0; display: flex; flex-direction: column; background: #FFFFFF">
<sc-for list="{{ kids }}" as="k" hint-placeholder-count="7">
<div style="display: flex; align-items: center; gap: 8px; min-height: 68px; box-sizing: border-box; padding: 8px 12px 8px 16px; background: {{k.rowBg}}; border-bottom: 1px solid #D3DBE2">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 21px; font-weight: 600; line-height: 1.2">{{k.name}}</span><span style="font-size: 13.5px; color: #5A6B7A; line-height: 1.3">{{k.sub}}</span></div>
<button type="button" onClick="{{ k.board }}" aria-pressed="{{k.inPressed}}" style="flex: none; width: 98px; min-height: 52px; border: 2px solid {{k.inBd}}; background: {{k.inBg}}; color: {{k.inFg}}; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer">{{k.inLabel}}</button>
<button type="button" onClick="{{ k.absent }}" aria-pressed="{{k.outPressed}}" style="flex: none; width: 82px; min-height: 52px; border: 2px solid {{k.outBd}}; background: {{k.outBg}}; color: {{k.outFg}}; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">नहीं आए</button>
</div>
</sc-for>
</main>

<div style="flex: none; padding: 8px 16px; font-size: 15px; color: #5A6B7A; background: #EEF1F4">आगे: कन्हेड़ी (4 बच्चे) · टोहाना शहर (3 बच्चे)</div>

<footer style="flex: none; padding: 8px 16px 16px; background: #EEF1F4">
<a href="MobileOffline.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; background: #16222E; color: #FFFFFF; font-size: 19px; font-weight: 700; text-decoration: none">अगला स्टॉप: कन्हेड़ी ›</a>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const GOOD = '#2E7D5B', BAD = '#B4332B', INK = '#16222E', WHITE = '#FFFFFF', LINE = '#7F8E9B';
const base = [
{ id: 'aryan', name: 'आर्यन', cls: 'कक्षा 3 B' },
{ id: 'siya', name: 'सिया', cls: 'कक्षा 11 B' },
{ id: 'manpreet', name: 'मनप्रीत', cls: 'कक्षा 6 A' },
{ id: 'tanvi', name: 'तन्वी', cls: 'UKG' },
{ id: 'harsh', name: 'हर्ष', cls: 'कक्षा 4 A' },
{ id: 'nikhil', name: 'निखिल', cls: 'कक्षा 8 B' },
{ id: 'pooja', name: 'पूजा', cls: 'कक्षा 1 A' }
];
const initial = {
aryan: { s: 'in', t: '7:42' },
siya: { s: 'in', t: '7:42' },
manpreet: { s: 'in', t: '7:42' },
tanvi: { s: 'in', t: '7:43' }
};
const marks = (this.state && this.state.marks) || initial;
const clock = () => {
const d = new Date();
const h = d.getHours() % 12 || 12;
const m = d.getMinutes();
return h + ':' + (m < 10 ? '0' + m : m);
};
const tap = (id, s) => () => {
const next = Object.assign({}, marks);
if (next[id] && next[id].s === s) { delete next[id]; } else { next[id] = { s: s, t: clock() }; }
this.setState({ marks: next });
};
const kids = base.map((k) => {
const m = marks[k.id];
const isIn = !!m && m.s === 'in';
const isOut = !!m && m.s === 'out';
return {
name: k.name,
sub: isIn ? k.cls + ' · ' + m.t + ' पर चढ़े' : (isOut ? k.cls + ' · आज नहीं आए' : k.cls),
rowBg: isIn ? '#EDF5F0' : (isOut ? '#F8ECEB' : WHITE),
inLabel: isIn ? '✓ चढ़ गए' : 'चढ़ गए',
inBg: isIn ? GOOD : WHITE, inFg: isIn ? WHITE : INK, inBd: isIn ? GOOD : LINE,
outBg: isOut ? BAD : WHITE, outFg: isOut ? WHITE : INK, outBd: isOut ? BAD : LINE,
inPressed: isIn ? 'true' : 'false', outPressed: isOut ? 'true' : 'false',
isIn: isIn, isOut: isOut,
board: tap(k.id, 'in'),
absent: tap(k.id, 'out')
};
});
const inHere = kids.filter((k) => k.isIn).length;
const outHere = kids.filter((k) => k.isOut).length;
const left = kids.length - inHere - outHere;
return {
kids: kids,
total: (5 + inHere) + ' / 19',
here: inHere + ' चढ़े · ' + outHere + ' नहीं आए · ' + left + ' बाकी'
};
}
}
</script>
</body>
</html>
